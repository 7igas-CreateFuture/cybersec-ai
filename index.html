<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Local AI</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/ui.css"></head><body>
<div class="shell"><nav class="sidebar" id="sidebar" aria-label="聊天导航"><div class="brand-row"><span class="brand">Local AI</span><button id="collapse-nav" class="icon" aria-label="折叠侧栏" title="折叠侧栏">‹</button></div><button id="clear" class="new-chat"><span>＋</span>新对话</button><section class="sessions"><p class="caption">历史对话</p><p id="history-empty" class="empty-history">暂无对话</p><button id="session" class="session" hidden aria-current="page"><strong id="session-title"></strong><small>当前草稿 · 未保存</small></button><div id="history-list"></div><p id="history-error" class="history-error" role="status"></p></section><div><button class="settings" disabled>设置<small>规划中</small></button><p class="nav-note">问答自动存入本机数据库；附件原文件不保存。</p></div></nav>
<main class="workspace" id="workspace"><header class="topbar" id="topbar"><button id="restore-nav" class="icon" aria-label="展开侧栏" hidden>☰</button><div class="model-wrap"><button id="model-button" class="model-button" aria-expanded="false" aria-controls="model-menu" disabled><span id="model-name">正在读取模型…</span><b aria-hidden="true">⌄</b></button><section class="model-menu" id="model-menu" aria-label="本地模型选择" hidden><div class="menu-head"><span>已安装的本地模型</span><button id="refresh-models" class="quiet">刷新</button></div><div id="model-list" class="model-list" role="listbox" aria-label="可用模型"></div><p id="model-error" class="menu-error" role="status"></p><p class="menu-note">选择后用于后续请求，不下载新模型。</p></section></div><div class="top-actions"><button id="restore-widget" class="quiet" hidden>Widgets</button><button id="export" class="quiet" disabled>导出</button></div></header>
<div class="chat-scroll" id="chat-scroll"><div class="chat" id="chat" role="log" aria-label="聊天内容" aria-live="polite"></div></div>
<div class="composer-area" id="composer-area"><div class="composer-wrap"><div class="composer"><div class="attachment-chip" id="attachment-chip" hidden><span id="filename"></span><button id="remove" aria-label="移除附件">×</button></div><label for="prompt" class="sr-only">工作要求</label><textarea id="prompt" placeholder="写下你的问题，或附上一份资料…"></textarea><div class="composer-tools"><label class="attach">＋ 附加文件<input id="file" type="file" aria-label="附加参考文件" accept=".docx,.xlsx,.pdf,.txt,.csv,.md,.log,.tsv"></label><span class="keyhint">Enter 发送 · Shift + Enter 换行</span><button id="stop" class="stop" aria-label="停止生成" title="停止生成" hidden>■</button><button id="send" class="send" aria-label="发送" title="发送" disabled>↑</button></div></div><div id="status" class="status" role="status"></div><div class="footer">developed by igas</div></div></div></main></div>
<div id="widget" class="widget"><button id="capsule" class="capsule" aria-label="展开 Widget 工作台" aria-expanded="false" aria-controls="workbench"><span class="led"></span><span id="widget-text" class="widget-text">VRAM 未检测</span><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button><button id="widget-close" class="widget-close" aria-label="隐藏 Widget" title="隐藏 Widget">×</button></div>
<section id="workbench" class="workbench" aria-label="Widget 工作台" hidden><div class="bench-head"><span>Local AI · 工作台</span><button id="minimize-widget" class="icon" aria-label="收起工作台" title="收起工作台">—</button></div><div class="bench-grid"><article class="tile"><h3>GPU Memory</h3><strong id="gpu-percent">不可用</strong><div class="meter"><span id="gpu-meter"></span></div><p id="gpu-detail">等待本机显存数据</p></article><article class="tile"><h3>Tokens / sec</h3><strong id="speed">暂无数据</strong><p id="speed-detail">完成推理后显示准确统计</p></article><article class="tile"><h3>Model</h3><strong id="widget-model" class="model-value">未选择</strong><p id="model-state">未检测</p></article><article class="tile workspace-tile"><h3>Workspace</h3><strong>规划中</strong><p>文件管理与工具系统<br>当前可在输入框附加文件。</p></article></div><p class="bench-foot" id="metric-source">显存来自 nvidia-smi · 速度来自 Ollama 完成统计</p></section>
<script nonce="__TOKEN__">window.LOCAL_TOKEN='__TOKEN__';</script><script nonce="__TOKEN__" src="/ui.js"></script></body></html>
